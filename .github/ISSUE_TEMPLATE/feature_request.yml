name: 기능 제안
description: 해결하고 싶은 사용자 문제를 제안해 주세요.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 어떤 문제를 해결하나요?
      description: 기능 이름보다 현재 겪는 불편을 먼저 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 해결 방법
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 고려한 다른 방법
  - type: textarea
    id: context
    attributes:
      label: 추가 맥락
      description: 참고 화면, 스케치, 관련 이슈가 있다면 첨부해 주세요.
