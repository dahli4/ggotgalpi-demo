name: iOS Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify Xcode and iOS SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project GgotgalpiDemo.xcodeproj \
            -scheme GgotgalpiDemo \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .derivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Validate bundled privacy manifest
        run: |
          manifest=".derivedData/Build/Products/Debug-iphonesimulator/GgotgalpiDemo.app/PrivacyInfo.xcprivacy"
          plutil -lint "$manifest"
          test "$(plutil -extract NSPrivacyAccessedAPITypes.0.NSPrivacyAccessedAPIType raw "$manifest")" = NSPrivacyAccessedAPICategoryUserDefaults
          test "$(plutil -extract NSPrivacyAccessedAPITypes.0.NSPrivacyAccessedAPITypeReasons.0 raw "$manifest")" = CA92.1

      - name: Test synced settings and model store
        run: |
          build_dir="$(mktemp -d)"
          trap 'rm -rf "$build_dir"' EXIT
          xcrun swiftc -swift-version 6 -warnings-as-errors -parse-as-library \
            GgotgalpiDemo/Core/SyncedSettings.swift Tests/SyncedSettingsTests.swift \
            -o "$build_dir/settings-tests"
          "$build_dir/settings-tests"
          xcrun swiftc -swift-version 5 -warnings-as-errors -parse-as-library \
            GgotgalpiDemo/Core/SyncedSettings.swift GgotgalpiDemo/Core/Models.swift \
            Tests/DemoStoreTests.swift -o "$build_dir/store-tests"
          "$build_dir/store-tests"
