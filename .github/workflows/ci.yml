name: iOS Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project GgotgalpiDemo.xcodeproj \
            -scheme GgotgalpiDemo \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .derivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
